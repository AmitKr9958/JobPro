<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPro</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div><b>JobPro</b><span>Free AI Job Assistant</span></div><button id="syncBtn">Sync</button></header>
<nav><button class="tab active" data-tab="home">Autofill</button><button class="tab" data-tab="ai">AI</button><button class="tab" data-tab="jobs">Jobs</button><button class="tab" data-tab="tracker">Tracker</button><button class="tab" data-tab="settings">Settings</button></nav>
<main>
<section id="home" class="panel">
  <button id="autofillBtn" class="primary">⚡ Autofill This Page</button>
  <div class="grid"><button id="editProfileBtn">Edit profile</button><button id="newProfileBtn">New profile</button></div>
  <label>Profile<select id="profileSelect"></select></label>
  <div class="card"><b>Current profile</b><div id="preview"></div></div>
  <div id="status" class="status"></div>
</section>
<section id="ai" class="panel hidden">
  <div class="card"><b>AI answers</b><p>AI sees only job text and non-sensitive resume/profile facts. Phone, address, IDs and salary are never sent.</p><button id="answerBtn" class="primary">Answer current application question</button><textarea id="aiOutput" placeholder="AI result"></textarea></div>
  <div class="grid"><button id="tailorBtn">Tailor resume</button><button id="coverBtn">Write cover letter</button></div>
  <div class="card"><button id="scoreBtn">Job match score</button><div id="scoreOutput"></div></div>
</section>
<section id="jobs" class="panel hidden">
  <div class="grid"><input id="jobQuery" placeholder="Power BI Developer"><input id="jobLocation" placeholder="Delhi NCR"></div><button id="searchJobsBtn" class="primary">Find jobs</button><div id="jobsList"></div>
</section>
<section id="tracker" class="panel hidden">
  <div class="card"><b>Application tracker</b><p>Nothing is auto-submitted. Save or mark an application manually.</p></div><div id="trackerList"></div>
</section>
<section id="settings" class="panel hidden">
  <div class="card"><b>Supabase</b><input id="sbUrl" placeholder="Supabase project URL"><input id="sbKey" placeholder="Publishable/anon key"><button id="saveConfigBtn">Save connection</button></div>
  <div class="card"><b>Account</b><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><div class="grid"><button id="loginBtn">Log in</button><button id="signupBtn">Sign up</button></div><button id="logoutBtn">Log out</button><div id="authStatus"></div></div>
  <div class="card"><label><input type="checkbox" id="fabToggle" checked> Show floating autofill button</label><label><input type="checkbox" id="emptyToggle" checked> Fill only empty fields</label></div>
  <div class="card"><b>Profile</b><form id="profileForm">
    <input id="f_name" placeholder="Profile name"><input id="f_fullName" placeholder="Full name"><input id="f_email" placeholder="Email"><input id="f_phone" placeholder="Phone">
    <input id="f_linkedin" placeholder="LinkedIn"><input id="f_github" placeholder="GitHub"><input id="f_portfolio" placeholder="Portfolio">
    <input id="f_currentTitle" placeholder="Current title"><input id="f_currentCompany" placeholder="Current company"><input id="f_yearsExperience" placeholder="Years of experience">
    <input id="f_education" placeholder="Education"><input id="f_skills" placeholder="Skills">
    <input id="f_city" placeholder="City"><input id="f_state" placeholder="State"><input id="f_country" placeholder="Country">
    <textarea id="f_resumeText" placeholder="Resume text"></textarea><input id="f_resumeFile" type="file" accept=".pdf,application/pdf"><small id="resumeFileName"></small>
    <textarea id="f_coverLetterTemplate" placeholder="Cover letter template"></textarea><textarea id="f_answers" placeholder='Application answers JSON'></textarea>
    <button class="primary" type="submit">Save profile</button>
  </form></div>
</section>
</main><script src="supabase-client.js"></script><script src="popup.js"></script></body></html>
