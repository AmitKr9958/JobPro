<!doctype html><html><body>
<form>
<label for="given">Given name</label><input id="given" autocomplete="given-name">
<label for="family">Family name</label><input id="family" autocomplete="family-name">
<label for="mail">Email</label><input id="mail" autocomplete="email" type="text">
<label for="tel">Mobile</label><input id="tel" autocomplete="tel">
<label for="addr">Street</label><input id="addr" autocomplete="street-address">
<label for="town">Town</label><input id="town" autocomplete="address-level2">
<label for="region">Region</label><input id="region" autocomplete="address-level1">
<label for="postal">Postal</label><input id="postal" autocomplete="postal-code">
<label for="nation">Country</label><input id="nation" autocomplete="country-name">
<label for="org">Employer</label><input id="org" autocomplete="organization">
<label for="title">Job title</label><input id="title" autocomplete="organization-title">
<select id="auth" aria-label="Are you legally authorized to work?"><option value="">Select</option><option value="Yes">Yes</option><option value="No">No</option></select>
</form></body></html>
